name: postgresql

services:
  postgres:
    image: postgres:19.0-trixie
    container_name: postgres
    restart: unless-stopped   # comes back after crashes and reboots, stays down if you stop it
    # Run as postgres from the start. The image only uses its gosu helper to step down from
    # root, so gosu never runs, and nothing in the container runs as root.
    user: postgres
    shm_size: 256mb           # Docker's 64 MB default is too small for parallel queries
    environment:
      POSTGRES_DB: dev
      # Only read on the very first start (empty data volume). Set for one run by
      # scripts/Initialize-PostgreSql.ps1, which then hands the superuser to OpenBao
      # (rotate-root). Empty on every other start, so no password is stored anywhere.
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"   # localhost only, IPv4
      - "[::1]:5432:5432"       # and IPv6: some clients try localhost as ::1 first
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker
      - postgres-data:/var/lib/postgresql
    networks:
      - local-dev-stack
    healthcheck:
      # -h 127.0.0.1 forces TCP: the temporary server used during first-time init
      # only listens on the socket, so this stays unhealthy until init has finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d dev"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"         # at most ~30 MB of logs

volumes:
  postgres-data:

networks:
  local-dev-stack:
    external: true
